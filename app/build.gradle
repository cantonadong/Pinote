plugins { id 'com.android.application' }

android { namespace 'com.cantonadong.pinote'; compileSdk 36
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    defaultConfig { applicationId 'com.cantonadong.pinote'; minSdk 26; targetSdk 36; versionCode 8; versionName '1.2.0' }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

androidComponents { onVariants(selector().all()) { variant -> variant.outputs.each { it.outputFileName.set("Pinote.apk") } } }
